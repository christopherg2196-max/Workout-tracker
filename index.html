<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e10613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="home" class="active"><span class="ico">&#8962;</span>Home</button>
    <button data-tab="history"><span class="ico">&#9776;</span>History</button>
    <button data-tab="progress"><span class="ico">&#8599;</span>Progress</button>
    <button data-tab="settings"><span class="ico">&#9881;</span>Settings</button>
  </nav>
  <script src="chart.js"></script>
  <script src="progression.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
  <script>
    // Offline support. Needs https or localhost; silently skipped elsewhere (e.g. file://).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
